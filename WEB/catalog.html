<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWAG CLUB — Каталог</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f5f4ef;
    --panel: #eae8df;
    --panel2: #e0ded3;
    --line: #d1cdbe;
    --text: #1a1917;
    --text-dim: #666155;
    --text-faint: #8a8374;
    --accent: #ff3b20;
    --accent-dim: #ffdedb;
    --vh: 1vh;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  body {
    min-height: calc(var(--vh, 1vh) * 100);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .mono {
    font-family: 'JetBrains Mono', monospace;
  }

  .bg-grain {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.06;
    mix-blend-mode: multiply;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23n)"/></svg>');
  }

  .bg-vignette {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    box-shadow: inset 0 0 160px 50px rgba(0,0,0,0.05);
  }

  .tag {
    position: fixed;
    z-index: 3;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--text-faint);
    pointer-events: none;
  }

  .tag.tl {
    top: 25px;
    left: 18px;
    text-align: left;
  }

  .tag.tl b {
    color: var(--text-dim);
  }

  .tag.tr {
    top: 25px;
    right: 18px;
    text-align: right;
  }

  .tag.tr b {
    color: var(--text-dim);
  }

  .spine {
    position: fixed;
    z-index: 3;
    left: 8px;
    top: 50%;
    transform: translateY(-50%) rotate(-90deg) translateX(50%);
    transform-origin: left center;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text-faint);
    font-weight: 700;
    white-space: nowrap;
    pointer-events: none;
  }

  .profile-btn {
    position: fixed;
    z-index: 5;
    top: 52px;
    right: 18px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--text);
    border: 1px solid var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  .profile-btn:active {
    transform: scale(0.92);
  }

  .profile-btn svg {
    width: 17px;
    height: 17px;
  }

  .profile-btn path {
    stroke: var(--bg);
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .marquee {
    position: relative;
    z-index: 2;
    width: 100%;
    overflow: hidden;
    background: #1a1917;
    border-bottom: 1px solid var(--line);
    padding: 6px 0;
    flex-shrink: 0;
  }

  .marquee-track {
    display: flex;
    width: max-content;
    animation: scrollLeft 18s linear infinite;
  }

  .marquee-item {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: #8f887a;
    padding: 0 20px;
    white-space: nowrap;
  }

  .marquee-item b {
    color: var(--accent);
  }

  @keyframes scrollLeft {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  .screen {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 24px 16px;
    text-align: center;
    overflow-y: auto;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }

  .screen.in {
    opacity: 1;
    transform: translateY(0);
  }

  .screen::-webkit-scrollbar {
    display: none;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    font-weight: 600;
    color: var(--text-faint);
    margin-bottom: 12px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.1s;
  }

  .eyebrow b {
    color: var(--accent);
  }

  .headline {
    width: 100%;
    max-width: 250px;
    line-height: 0.86;
    color: var(--text);
    margin: 4px 0 6px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.2s;
  }

  .headline img {
    width: 100%;
    height: auto;
    display: block;
  }

  .divider {
    width: 100%;
    max-width: 340px;
    height: 1px;
    margin: 6px auto 4px;
    background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px);
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.3s;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .cat-list {
    width: 100%;
    max-width: 340px;
    margin-top: 4px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.4s;
  }

  .cat-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 2px;
    border-bottom: 1px dashed var(--line);
    background: none;
    border-left: none;
    border-right: none;
    border-top: none;
    width: 100%;
    cursor: pointer;
    text-align: left;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }

  .cat-list .cat-row:first-child {
    border-top: 1px dashed var(--line);
  }

  .cat-row:active {
    transform: scale(0.98);
    opacity: 0.8;
  }

  .cat-index {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    font-weight: 600;
    flex-shrink: 0;
    width: 22px;
  }

  .cat-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 25px;
    letter-spacing: 0.8px;
    line-height: 0.95;
    text-transform: uppercase;
    color: var(--text);
  }

  .cat-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    margin-left: auto;
    text-align: right;
    max-width: 90px;
    line-height: 1.2;
    flex-shrink: 0;
  }

  .cat-meta.hot {
    color: var(--accent);
  }

  .cat-arrow {
    font-size: 16px;
    color: var(--text-faint);
    flex-shrink: 0;
    transition: transform 0.15s ease;
    margin-left: 4px;
  }

  .cat-row:active .cat-arrow {
    transform: translateX(3px);
    color: var(--accent);
  }

  .decor-line-wrap {
    width: 100%;
    max-width: 340px;
    margin: 28px auto 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.5s;
  }

  .accent-curve {
    width: 100%;
    height: 80px;
    overflow: visible;
  }

  .accent-curve path {
    stroke: var(--accent);
    stroke-width: 4.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 850;
    stroke-dashoffset: 850;
    animation: drawLine 2s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.6s;
  }

  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }

  .foot {
    position: relative;
    z-index: 1;
    padding: 10px 20px calc(14px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 1.5px;
    flex-shrink: 0;
  }

  .foot b {
    color: var(--text-dim);
  }
</style>
</head>
<body>

<div class="bg-grain"></div>
<div class="bg-vignette"></div>

<div class="tag tl">N.02<br><b>КАТАЛОГ</b></div>
<div class="tag tr"><b>SWAG</b> / 002<br><span id="tagDate">--.--</span></div>
<div class="spine">ВЫБЕРИ КАТЕГОРИЮ</div>

<button class="profile-btn" id="profileBtn" aria-label="Профиль">
  <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M4 20c1.6-3.8 5-6 8-6s6.4 2.2 8 6"/></svg>
</button>

<div class="marquee">
  <div class="marquee-track" id="marqueeTrack">
    <div class="marquee-item"><b>EARLY ACCESS</b> — ТОЛЬКО ДЛЯ СВОИХ —</div>
    <div class="marquee-item"><b>EARLY ACCESS</b> — ТОЛЬКО ДЛЯ СВОИХ —</div>
    <div class="marquee-item"><b>EARLY ACCESS</b> — ТОЛЬКО ДЛЯ СВОИХ —</div>
    <div class="marquee-item"><b>EARLY ACCESS</b> — ТОЛЬКО ДЛЯ СВОИХ —</div>
  </div>
</div>

<div class="screen" id="screen">
  <div class="eyebrow">[ <b>SWAG CLUB</b> × ROLDOZZZER ]</div>

  <div class="headline">
    <img src="img/CATALOG.png" alt="КАТАЛОГ">
  </div>

  <div class="divider"></div>

  <div class="cat-list" id="catList"></div>

  <div class="decor-line-wrap">
    <svg class="accent-curve" viewBox="0 0 340 140" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 0 95 C 25 80, 60 10, 95 10 C 130 10, 135 130, 165 130 C 195 130, 200 5, 235 5 C 270 5, 280 125, 305 125 C 320 125, 330 65, 340 30" />
    </svg>
  </div>
</div>

<div class="foot"><b>SWAGCLUB.RU</b> · ROLDOZZZER</div>

<script>
(function() {
  function setVh() {
    document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
  }
  setVh();
  window.addEventListener('resize', setVh);

  var track = document.getElementById('marqueeTrack');
  if (track) {
    track.innerHTML += track.innerHTML;
  }

  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#f5f4ef');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#f5f4ef');
      
      if (tg.BackButton) {
        tg.BackButton.hide();
      }
    } catch(e) {
      console.warn('Telegram WebApp init:', e);
    }
  }

  var urlParams = new URLSearchParams(window.location.search);
  var currentQuery = urlParams.toString() ? ('?' + urlParams.toString()) : '';

  var screen = document.getElementById('screen');
  if (screen) {
    setTimeout(function() {
      screen.classList.add('in');
    }, 100);
  }

  var tagDateEl = document.getElementById('tagDate');
  if (tagDateEl) {
    var now = new Date();
    var dd = String(now.getDate()).padStart(2, '0');
    var mm = String(now.getMonth() + 1).padStart(2, '0');
    tagDateEl.textContent = dd + '.' + mm;
  }

  function navigateTo(url) {
    if (tg && tg.HapticFeedback) {
      try {
        tg.HapticFeedback.impactOccurred('light');
      } catch(e) {}
    }
    if (screen) {
      screen.classList.remove('in');
    }
    setTimeout(function() {
      window.location.href = url;
    }, 250);
  }

  var CATEGORIES = [
    { slug: 'haparovsk', name: 'Хапаровск', meta: 'ДРОП 02', hot: false, customUrl: 'HAPAROVSK/haparovsk.html' },
    { slug: 'norules', name: 'No Rules', meta: 'NEW', hot: false, customUrl: 'NO RULES/norules.html'},
    { slug: 'magbottle', name: 'MagBottle', meta: 'NEW', hot: false, customUrl: 'MAGBOTTLE/magbottle.html' },
    { slug: 'semeyniki', name: 'Ох**ые<br>семейники', meta: 'СКОРО', hot: false, customUrl: 'category_soon.html' },
    { slug: 'accessories', name: 'Аксессуары', meta: 'ПАТЧИ И МЕЛОЧЬ', hot: false, customUrl: 'category_soon.html' },
    { slug: 'other', name: 'Другое', meta: 'ДРОП 01', hot: false, customUrl: 'category_soon.html'}
  ];

  var listEl = document.getElementById('catList');

  CATEGORIES.forEach(function(cat, i) {
    var row = document.createElement('button');
    row.className = 'cat-row';
    
    var isAccent = cat.hot || cat.meta === 'NEW';

    row.innerHTML =
      '<span class="cat-index mono">' + String(i + 1).padStart(2, '0') + '</span>' +
      '<span class="cat-name">' + cat.name + '</span>' +
      '<span class="cat-meta mono' + (isAccent ? ' hot' : '') + '">' + cat.meta + '</span>' +
      '<span class="cat-arrow">→</span>';

    row.addEventListener('click', function() {
      var targetUrl;
      if (cat.customUrl) {
        targetUrl = cat.customUrl + currentQuery;
      } else {
        targetUrl = 'category.html' + currentQuery + (currentQuery ? '&' : '?') + 'slug=' + encodeURIComponent(cat.slug);
      }
      navigateTo(targetUrl);
    });

    listEl.appendChild(row);
  });

  var profileBtn = document.getElementById('profileBtn');
  if (profileBtn) {
    profileBtn.addEventListener('click', function() {
      navigateTo('profile.html' + currentQuery);
    });
  }
})();
</script>

</body>
</html>
