<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SWAG CLUB — Хапаровск</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f5f4ef;
    --panel: #eae8df;
    --panel2: #e0ded3;
    --line: #d1cdbe;
    --text: #1a1917;
    --text-dim: #666155;
    --text-faint: #9e988a;
    --accent: #ff3b20;
    --accent-dim: #ffdedb;
    --vh: 1vh;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  body {
    min-height: calc(var(--vh, 1vh) * 100);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .mono {
    font-family: 'JetBrains Mono', monospace;
  }

  .bg-grain {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.06;
    mix-blend-mode: multiply;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23n)"/></svg>');
  }

  .bg-vignette {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    box-shadow: inset 0 0 160px 50px rgba(0,0,0,0.05);
  }

  .tag {
    position: fixed;
    z-index: 3;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--text-faint);
    pointer-events: none;
  }

  .tag.tl {
    top: 16px;
    left: 18px;
    text-align: left;
  }

  .tag.tl b {
    color: var(--text-dim);
  }

  .tag.tr {
    top: 16px;
    right: 18px;
    text-align: right;
  }

  .tag.tr b {
    color: var(--text-dim);
  }

  .spine {
    position: fixed;
    z-index: 3;
    left: 8px;
    top: 50%;
    transform: translateY(-50%) rotate(-90deg) translateX(50%);
    transform-origin: left center;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text-faint);
    font-weight: 700;
    white-space: nowrap;
    pointer-events: none;
  }

  .back-btn {
    position: fixed;
    z-index: 5;
    top: 52px;
    left: 18px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--text);
    border: 1px solid var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  .back-btn:active {
    transform: scale(0.92);
  }

  .back-btn svg {
    width: 16px;
    height: 16px;
  }

  .back-btn path {
    stroke: var(--bg);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .marquee {
    position: relative;
    z-index: 2;
    width: 100%;
    overflow: hidden;
    background: #1a1917;
    border-bottom: 1px solid var(--line);
    padding: 6px 0;
    flex-shrink: 0;
  }

  .marquee-track {
    display: flex;
    width: max-content;
    animation: scrollLeft 18s linear infinite;
  }

  .marquee-item {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: #8f887a;
    padding: 0 20px;
    white-space: nowrap;
  }

  .marquee-item b {
    color: var(--accent);
  }

  @keyframes scrollLeft {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  .screen {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 16px;
    text-align: center;
    overflow-y: auto;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }

  .screen.in {
    opacity: 1;
    transform: translateY(0);
  }

  .screen::-webkit-scrollbar {
    display: none;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    font-weight: 600;
    color: var(--text-faint);
    margin-bottom: 12px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.1s;
  }

  .eyebrow b {
    color: var(--accent);
  }

  .headline {
    font-family: 'Oswald', sans-serif;
    font-size: 32px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text);
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.2s;
  }

  .divider {
    width: 100%;
    max-width: 380px;
    height: 1px;
    margin: 4px auto 16px;
    background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px);
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.3s;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .products-grid {
    width: 100%;
    max-width: 380px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.4s;
  }

  .product-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    text-align: left;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }

  .product-card:active {
    transform: scale(0.98);
  }

  .product-img-wrap {
    width: 100%;
    aspect-ratio: 1/1;
    background: var(--panel2);
    position: relative;
    overflow: hidden;
  }

  .product-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .product-info {
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .product-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text);
    line-height: 1.1;
  }

  .product-price {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }

  .foot {
    position: relative;
    z-index: 1;
    padding: 18px 20px calc(14px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 1.5px;
    flex-shrink: 0;
  }

  .foot b {
    color: var(--text-dim);
  }
</style>
</head>
<body>

<div class="bg-grain"></div>
<div class="bg-vignette"></div>

<div class="tag tl">N.03<br><b>КАТЕГОРИЯ</b></div>
<div class="tag tr"><b>SWAG</b> / HAP<br>27.07</div>
<div class="spine">ХАПАРОВСК</div>

<button class="back-btn" id="backBtn" aria-label="Назад">
  <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
</button>

<div class="marquee">
  <div class="marquee-track" id="marqueeTrack">
    <div class="marquee-item"><b>ХАПАРОВСК</b> — ДРОП 02 —</div>
    <div class="marquee-item"><b>ХАПАРОВСК</b> — ДРОП 02 —</div>
  </div>
</div>

<div class="screen" id="screen">
  <div class="eyebrow">[ <b>SWAG CLUB</b> × ДРОП 02 ]</div>
  <div class="headline">Хапаровск</div>
  <div class="divider"></div>

  <div class="products-grid" id="productsGrid">
    <div class="product-card" data-id="kislota">
      <div class="product-img-wrap">
        <img src="img_hap/KISLOTA_1.png" alt="KISLOTA_1">
      </div>
      <div class="product-info">
        <div class="product-name">КИСЛОТА</div>
        <div class="product-price">8 500 ₽</div>
      </div>
    </div>

    <div class="product-card" data-id="tray">
      <div class="product-img-wrap">
        <img src="img_hap/TARELKA_1.png" alt="TARELKA_1">
      </div>
      <div class="product-info">
        <div class="product-name">ТАРЕЛКА</div>
        <div class="product-price">1 500 ₽</div>
      </div>
    </div>
  </div>
</div>

<div class="foot"><b>SWAGCLUB.RU</b> · ROLDOZZZER</div>

<script>
(function() {
  function setVh() {
    document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
  }
  setVh();
  window.addEventListener('resize', setVh);

  var track = document.getElementById('marqueeTrack');
  if (track) {
    track.innerHTML += track.innerHTML;
  }

  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#f5f4ef');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#f5f4ef');
      if (tg.BackButton) tg.BackButton.hide();
    } catch(e) {
      console.warn('Telegram WebApp init:', e);
    }
  }

  var urlParams = new URLSearchParams(window.location.search);
  var currentQuery = urlParams.toString() ? ('?' + urlParams.toString()) : '';

  var screen = document.getElementById('screen');
  if (screen) {
    setTimeout(function() {
      screen.classList.add('in');
    }, 100);
  }

  function navigateTo(url) {
    if (tg && tg.HapticFeedback) {
      try {
        tg.HapticFeedback.impactOccurred('light');
      } catch(e) {}
    }
    if (screen) {
      screen.classList.remove('in');
    }
    setTimeout(function() {
      window.location.href = url;
    }, 250);
  }

  var backBtn = document.getElementById('backBtn');
  if (backBtn) {
    backBtn.addEventListener('click', function() {
      navigateTo('../catalog.html' + currentQuery);
    });
  }

  var cards = document.querySelectorAll('.product-card');
  cards.forEach(function(card) {
    var productId = card.getAttribute('data-id');
    card.addEventListener('click', function() {
      var targetUrl;
      
      if (productId === 'kislota') {
        targetUrl = 'kislota.html' + currentQuery;
      } else {
        targetUrl = 'product.html' + currentQuery + (currentQuery ? '&' : '?') + 'id=' + productId;
      }
      
      navigateTo(targetUrl);
    });
  });
})();
</script>

</body>
</html>
